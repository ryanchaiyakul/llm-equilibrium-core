[project]
name = "llm-equilibrium-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ryanchaiyakul", email = "ryanchaiyakul@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beartype>=0.22.9",
    "dismech-jax",
    "jax>=0.10.0",
    "matplotlib>=3.10.9",
    "optax>=0.2.8",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
cuda13 = [
    "jax[cuda13]>=0.10.0",
]
cuda12 = [
    "jax[cuda12]>=0.10.0",
]
tpu = [
    "jax[tpu]>=0.10.0",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ruff>=0.15.11",
]

[tool.uv.sources]
dismech-jax = { git = "https://github.com/ryanchaiyakul/dismech-jax.git" }
